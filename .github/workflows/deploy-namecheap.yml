# Publishes public/ to Namecheap shared hosting on every push to main.
# Needs repository secrets (GitHub > Settings > Secrets and variables > Actions):
#   FTP_SERVER     e.g. ftp.jamescolife.com or the server name from cPanel
#   FTP_USERNAME   the cPanel FTP account
#   FTP_PASSWORD   that account's password
# Optional repository variable FTP_SERVER_DIR (default: public_html/)
# Until the secrets exist, the workflow skips the upload instead of failing.

name: Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namecheap-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check deploy settings
        id: settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FTP secrets are not set yet, so nothing was uploaded."
          fi

      - name: Check out the site
        if: steps.settings.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Upload public/ to Namecheap
        if: steps.settings.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./public/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            assets/manage.js
